    // Helper untuk mengacak pertanyaan & opsi pilihan jawaban
    function generateShuffledQuestions() {
      const deck = [...QUESTION_BANK];
      // Fisher-Yates shuffle array pertanyaan
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      // Acak urutan 4 opsi jawaban tiap soal agar posisi jawaban benar tidak statis
      return deck.map((item) => {
        const originalCorrectText = item.options[item.correct];
        const randomizedOptions = [...item.options];
        for (let i = randomizedOptions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [randomizedOptions[i], randomizedOptions[j]] = [randomizedOptions[j], randomizedOptions[i]];
        }
        const newCorrectIdx = randomizedOptions.indexOf(originalCorrectText);
        return {
          q: item.q,
          options: randomizedOptions,
          correct: newCorrectIdx,
        };
      });
    }

    // Helper resolusi client Supabase dengan safe fallback
    async function initSupabase() {
      let url = window.__SUPABASE_CONFIG__?.url;
      let key = window.__SUPABASE_CONFIG__?.anonKey;

      if (!url || !key) {
        try {
          const res = await fetch('/api/poll-config');
          if (res.ok) {
            const data = await res.json();
            if (data && data.isConfigured) {
              url = data.supabaseUrl;
              key = data.supabaseAnonKey;
            }
          }
        } catch (e) {}
      }

      const clientFactory = window.supabase?.createClient;
      if (typeof clientFactory === 'function' && url && key && url.startsWith('https://') && key.length > 20) {
        try {
          return clientFactory(url, key);
        } catch (e) {
          console.warn('Gagal konek Supabase, menggunakan fallback:', e);
        }
      }

      // Safe Fallback BroadcastChannel (in-browser real-time across tabs)
      let bc = null;
      try {
        bc = new BroadcastChannel('game_BEBEK-SERU');
      } catch (e) {}

      const listeners = { broadcast: [], presence: [] };
      const presenceState = new Map();

      if (bc) {
        bc.onmessage = (e) => {
          const { type, event, payload } = e.data || {};
          if (type === 'broadcast') {
            listeners.broadcast.forEach(fn => fn({ event, payload }));
          } else if (type === 'track') {
            presenceState.set(payload.id, payload);
            listeners.presence.forEach(fn => fn());
          }
        };
      }

      return {
        channel: (name) => {
          const ch = {
            on: function(kind, filter, cb) {
              const callback = typeof filter === 'function' ? filter : cb;
              if (kind === 'presence') listeners.presence.push(callback);
              if (kind === 'broadcast') {
                listeners.broadcast.push((msg) => {
                  if (!filter || !filter.event || filter.event === msg.event) {
                    callback(msg);
                  }
                });
              }
              return ch;
            },
            presenceState: () => {
              const out = {};
              presenceState.forEach((val, k) => { out[k] = [val]; });
              return out;
            },
            send: (msg) => {
              if (bc) bc.postMessage(msg);
              return 'ok';
            },
            subscribe: () => ch,
          };
          return ch;
        },
        removeChannel: () => {
          if (bc) bc.close();
        }
      };
    }

    // Efek Suara Sizzling Bebek Terbakar di Oven (Web Audio API synthesis)
    function playSizzleSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const bufferSize = ctx.sampleRate * 2.5;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.45 * Math.exp(-i / (ctx.sampleRate * 1.2));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 2400;
        filter.Q.value = 1.3;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

          canvas.height = 96;
          const spriteTex = new THREE.CanvasTexture(canvas);
          const spriteMat = new THREE.SpriteMaterial({ map: spriteTex, depthTest: false });
          const sprite = new THREE.Sprite(spriteMat);
          sprite.scale.set(4.5, 1.7, 1.0);
          sprite.position.set(0, 2.5, 0);
          group.add(sprite);

          return {
            group,
            sprite,
            canvas,
            spriteTex,
            duckMat,
            duck3D,
            originalColor: duckMat?.color ? duckMat.color.getHex() : 0xfacc15
          };
        }

        function updateDuckSprite(duckObj, player) {
          const { canvas, spriteTex } = duckObj;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Background box
          ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
          ctx.beginPath();
          ctx.roundRect(8, 8, 240, 80, 16);
          ctx.fill();
          ctx.strokeStyle = player.speedFactor > 1 ? '#f43f5e' : player.speedFactor < 1 ? '#10b981' : '#38bdf8';
          ctx.lineWidth = 4;
          ctx.stroke();

          // Nama & Jarak
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'center';
          const meters = Math.round((player.progress || 0) * 5);
          ctx.fillText(`${player.name.substring(0, 12)} (${meters}m)`, 128, 40);

          // Status Badge / Character Tag
          ctx.font = 'bold 18px sans-serif';
          if (player.speedFactor > 1) {
            ctx.fillStyle = '#fda4af';
            ctx.fillText('🔥 NGEBUT PANIK!', 128, 70);
          } else if (player.speedFactor < 1) {
            ctx.fillStyle = '#6ee7b7';
            ctx.fillText('🛑 REM AMAN', 128, 70);
          } else {
            const charMeta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === player.duckId))
              || DUCK_ASSETS.find((d) => d.id === player.duckId)
              || { name: `Bebek #${player.duckId}`, emoji: '🦆' };
            ctx.fillStyle = '#fde047';
            ctx.fillText(`${charMeta.emoji} ${charMeta.name.substring(0, 16)}`, 128, 70);
          }

          spriteTex.needsUpdate = true;
        }

        // 8. Render Loop 60 FPS
        let animId = null;
        let clock = new THREE.Clock();

        function animate() {
          animId = requestAnimationFrame(animate);
          const elapsed = clock.getElapsedTime();

          // A. Animasi ombak air sungai
          const pos = waterGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const vx = pos.getX(i);
            const vz = pos.getY(i);
            const wave = Math.sin(vx * 0.35 + elapsed * 3.2) * 0.22 + Math.cos(vz * 0.6 + elapsed * 2.2) * 0.14;
            pos.setZ(i, wave);
          }
          pos.needsUpdate = true;
          waterGeo.computeVertexNormals();

          // B. Animasi partikel kobaran api
          const pPositions = flameSystem.geometry.attributes.position.array;
          const pColors = flameSystem.geometry.attributes.color.array;
          for (let i = 0; i < particleCount; i++) {
            pPositions[i * 3 + 1] += particleVel[i].y;
            pPositions[i * 3 + 0] += particleVel[i].x;
            pPositions[i * 3 + 2] += particleVel[i].z;

            const py = pPositions[i * 3 + 1];
            if (py < 2.5) {
              pColors[i * 3 + 0] = 1.0;
              pColors[i * 3 + 1] = 0.95;
              pColors[i * 3 + 2] = 0.1;
            } else if (py < 5.0) {
              pColors[i * 3 + 0] = 1.0;
              pColors[i * 3 + 1] = 0.35;
              pColors[i * 3 + 2] = 0.0;
            } else {
              pColors[i * 3 + 0] = 0.45;
              pColors[i * 3 + 1] = 0.15;
              pColors[i * 3 + 2] = 0.05;
            }

            if (py > 7.5) {
              pPositions[i * 3 + 1] = 0.4 + Math.random() * 0.4;
              pPositions[i * 3 + 0] = 34 + Math.random() * 9;
              pPositions[i * 3 + 2] = -11 + Math.random() * 22;
            }
          }
          flameSystem.geometry.attributes.position.needsUpdate = true;
          flameSystem.geometry.attributes.color.needsUpdate = true;

          // C. Kedipan intensitas lampu kobaran api
          fireLight.intensity = 4.8 + Math.sin(elapsed * 24) * 1.6 + (Math.random() - 0.5) * 0.7;
          fireYellowLight.intensity = 2.5 + Math.cos(elapsed * 18) * 1.0;

          // D. Posisi dan Animasi Bebek
          const currentPlayers = Object.values(playersRef.current || {});
          const totalP = Math.max(1, currentPlayers.length);

          let leaderDuckX = -36;

          currentPlayers.forEach((p, idx) => {
            if (!duckGroups[p.id]) {
              const meta = DUCK_ASSETS.find((d) => d.id === p.duckId) || DUCK_ASSETS[idx % 10];
              const duckObj = createDuckMesh(meta);
              scene.add(duckObj.group);
              duckGroups[p.id] = duckObj;
            }

            const duckObj = duckGroups[p.id];
            const laneZ = (idx - (totalP - 1) / 2) * 2.3;
            const targetX = -36 + ((p.progress || 0) / 100) * 72;

            if (targetX > leaderDuckX) {
              leaderDuckX = targetX;
            }

            duckObj.group.position.x += (targetX - duckObj.group.position.x) * 0.14;
            duckObj.group.position.z += (laneZ - duckObj.group.position.z) * 0.14;

            const bobbing = Math.sin(elapsed * 5.5 + idx) * 0.18;
            duckObj.group.position.y = 0.5 + bobbing;
            duckObj.group.rotation.z = Math.sin(elapsed * 3.5 + idx) * 0.08;

            // Jika masuk ke kobaran api oven (progress >= 100)
            if (p.progress >= 100) {
              duckObj.group.rotation.x += 0.25;
              duckObj.group.rotation.y += 0.35;
              duckObj.group.position.y = 1.2 + Math.sin(elapsed * 15) * 0.6;
              duckObj.group.traverse((child) => {
                if (child.isMesh && child.material && child !== duckObj.sprite) {
                  if (child.material.color) {
                    child.material.color.setHex(0x381e11); // Gosong terbakar oven crispy
                  }
                }
              });
            } else {
              duckObj.group.rotation.x = 0;
              duckObj.group.rotation.y = 0;
            }

            updateDuckSprite(duckObj, p);
          });

          // E. Mode Kamera
          const currentMode = cameraModeRef.current;
          if (currentMode === 'PANORAMA') {
            camera.position.lerp(new THREE.Vector3(0, 26, 38), 0.08);
            camera.lookAt(2, 0, 0);
          } else if (currentMode === 'FOLLOW') {
            const camTarget = new THREE.Vector3(leaderDuckX - 8, 16, 22);
            camera.position.lerp(camTarget, 0.08);
            camera.lookAt(leaderDuckX + 5, 1, 0);
          } else if (currentMode === 'OVEN') {
            camera.position.lerp(new THREE.Vector3(42, 9, 0), 0.08);
            camera.lookAt(12, 1, 0);
          }

          renderer.render(scene, camera);
        }

        animate();

        const handleResize = () => {
          if (!container) return;
          const nw = container.clientWidth;
          const nh = container.clientHeight;
          camera.aspect = nw / nh;
          camera.updateProjectionMatrix();
          renderer.setSize(nw, nh);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
          renderer.dispose();
          if (container) container.innerHTML = '';
        };
      }, []);

      return (
        <div className="relative w-full h-[520px] rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-800 bg-slate-950">
          <div ref={containerRef} className="w-full h-full" />

          {/* Controls & Labels Viewport 3D */}
          <div className="absolute top-4 left-4 z-10 flex items-center gap-2 bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-700 text-xs shadow-lg">
            <span className="text-[10px] uppercase font-mono font-bold text-cyan-400">3D ARENA SUNGAI & OVEN PANGGANG</span>
          </div>

          <div className="absolute top-4 right-4 z-10 flex items-center gap-1.5 bg-slate-900/90 backdrop-blur p-1.5 rounded-xl border border-slate-700 shadow-lg">
            <span className="text-[10px] text-slate-400 font-bold px-1.5 hidden sm:inline">Kamera:</span>
            {[
              { id: 'PANORAMA', label: '🎥 Panoramik' },
              { id: 'FOLLOW', label: '🎯 Kejar Bebek' },
              { id: 'OVEN', label: '🔥 Sudut Oven' },
            ].map((btn) => (
              <button
                key={btn.id}
                onClick={() => setCameraMode(btn.id)}
                className={`text-[11px] font-bold px-2.5 py-1 rounded-lg transition ${
                  cameraMode === btn.id
                    ? 'bg-yellow-400 text-slate-950 shadow-md font-black'
                    : 'text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700'
                }`}
              >
                {btn.label}
              </button>
            ))}
          </div>

          {/* Banner Api Oven di Kanan */}
          <div className="absolute right-4 bottom-4 z-10 bg-rose-950/90 border-2 border-rose-500/80 px-3.5 py-1.5 rounded-xl text-center shadow-xl animate-pulse">
            <span className="text-[10px] font-black uppercase text-rose-300 tracking-wider block">FINISH LINE (500M)</span>
            <span className="text-sm font-black text-yellow-300">🔥 OVEN PANGGANG RAKSASA 🍗</span>
          </div>
        </div>
      );
    }

    function HostApp() {
      const [roomCode] = useState('BEBEK-SERU');
      const [players, setPlayers] = useState({});
      const [gameState, setGameState] = useState('LOBBY'); // LOBBY, RACING, FINISHED
      const [loser, setLoser] = useState(null);
      const [playUrl, setPlayUrl] = useState('');
      const [leaderboard, setLeaderboard] = useState([]);
      const [recentEvents, setRecentEvents] = useState([]);
      const [stats, setStats] = useState({ totalAnswered: 0, totalCorrect: 0, totalWrong: 0 });

      const channelRef = useRef(null);
      const rankBroadcastTickRef = useRef(0);

      useEffect(() => {
        const fullUrl = `${window.location.origin}/icebreaking/play`;
        setPlayUrl(fullUrl);

        let activeChannel = null;

        initSupabase().then((client) => {
          const channel = client.channel(`game_${roomCode}`, {
            config: { presence: { key: 'host' } },
          });

          channel.on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            setPlayers((prev) => {
              const updated = { ...prev };
              Object.values(state).flat().forEach((p) => {
                if (p && p.id && !updated[p.id]) {
                  updated[p.id] = {
                    id: p.id,
                    name: p.name || `Pemain #${p.duckId || 1}`,
                    duckId: p.duckId || 1,
                    progress: 0,
                    speedFactor: 1,
                  };
                }
              });
              return updated;
            });
          });

          channel.on('broadcast', { event: 'SUBMIT_ANSWER' }, ({ payload }) => {
            const { playerId, playerName, duckId, isCorrect, reason } = payload || {};

            setStats((prev) => ({
              totalAnswered: prev.totalAnswered + 1,
              totalCorrect: prev.totalCorrect + (isCorrect ? 1 : 0),
              totalWrong: prev.totalWrong + (!isCorrect ? 1 : 0),
            }));

            setRecentEvents((prev) => [
              {
                id: Date.now() + Math.random(),
                playerId,
                name: playerName || `Pemain #${duckId || 1}`,
                duckId: duckId || 1,
                isCorrect,
                reason,
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              },
              ...prev.slice(0, 5),
            ]);

            setPlayers((prev) => {
              if (!prev[playerId]) return prev;
              const current = prev[playerId];
              // Benar = Ngerem drastis (0.05x) dan mundur sedikit (-0.7% menjauh dari oven)
              // Salah / Timeout = Panik ngebut (2.4x) dan melonjak maju (+2.2% mendekat ke oven)
              const progressDelta = isCorrect ? -0.7 : 2.2;
              const newProgress = Math.max(0, Math.min(100, (current.progress || 0) + progressDelta));

              return {
                ...prev,
                [playerId]: {
                  ...current,
                  name: playerName || current.name,
                  duckId: duckId || current.duckId,
                  progress: newProgress,
                  speedFactor: isCorrect ? 0.05 : 2.4,
                },
              };
            });

            // Efek rem / boost aktif selama 2.2 detik
            setTimeout(() => {
              setPlayers((prev) => {
                if (!prev[playerId]) return prev;
                return {
                  ...prev,
                  [playerId]: { ...prev[playerId], speedFactor: 1 },
                };
              });
            }, 2200);
          });

          channel.subscribe();
          channelRef.current = channel;
          activeChannel = channel;
        });

        return () => {
          if (activeChannel && activeChannel.unsubscribe) {
            activeChannel.unsubscribe();
          }
        };
      }, [roomCode]);

      // Game Loop: Jalur Lebih Panjang & Endurance (Tick 50ms)
      useEffect(() => {
        if (gameState !== 'RACING') return;

        const interval = setInterval(() => {
          setPlayers((prev) => {
            let firstFinished = null;
            const updated = { ...prev };
            const ids = Object.keys(updated);

            if (ids.length === 0) return prev;

            // Base increment 0.075 per tick: Balapan berlangsung ~60-80 detik (jalur jauh lebih panjang & intens)
            const baseIncrement = 0.075;

            ids.forEach((id) => {
              const current = updated[id];
              const increment = baseIncrement * (current.speedFactor || 1);
              const newProgress = Math.min(100, (current.progress || 0) + increment);

              updated[id] = { ...current, progress: newProgress };

              if (newProgress >= 100 && !firstFinished) {
                firstFinished = updated[id];
              }
            });

            // Hitung Ranking Realtime untuk Dikirim ke HP Mahasiswa
            const sortedByDanger = Object.values(updated)
              .sort((a, b) => (b.progress || 0) - (a.progress || 0));

            setLeaderboard(sortedByDanger);

            // Broadcast posisi ranking ke semua HP setiap ~400ms (tiap 8 ticks)
            rankBroadcastTickRef.current += 1;
            if (rankBroadcastTickRef.current % 8 === 0) {
              const rankMap = {};
              const total = sortedByDanger.length;
              sortedByDanger.forEach((p, idx) => {
                rankMap[p.id] = {
                  rank: idx + 1,
                  total,
                  progress: Math.min(100, Math.round(p.progress || 0)),
                  ahead: idx > 0 ? sortedByDanger[idx - 1].name : null,
                  behind: idx < total - 1 ? sortedByDanger[idx + 1].name : null,
                  leaderName: sortedByDanger[0]?.name || '',
                };
              });

              channelRef.current?.send({
                type: 'broadcast',
                event: 'RACE_UPDATE',
                payload: { rankMap },
              });
            }

            if (firstFinished) {
              setGameState('FINISHED');
              setLoser(firstFinished);
              playSizzleSound();
              channelRef.current?.send({
                type: 'broadcast',
                event: 'GAME_OVER',
                payload: { loser: firstFinished },
              });

              if (window.confetti) {
                window.confetti({ particleCount: 160, spread: 90, origin: { y: 0.6 } });
              }
            }

            return updated;
          });
        }, 50);

        return () => clearInterval(interval);
      }, [gameState]);

      const startGame = () => {
        setGameState('RACING');
        setRecentEvents([]);
        setStats({ totalAnswered: 0, totalCorrect: 0, totalWrong: 0 });
        channelRef.current?.send({
          type: 'broadcast',
          event: 'START_GAME',
          payload: { timestamp: Date.now() },
        });
      };

      const resetGame = () => {
        setGameState('LOBBY');
        setLoser(null);
        setRecentEvents([]);
        setStats({ totalAnswered: 0, totalCorrect: 0, totalWrong: 0 });
        setPlayers((prev) => {
          const reset = {};
          Object.keys(prev).forEach((id) => {
            reset[id] = { ...prev[id], progress: 0, speedFactor: 1 };
          });
          return reset;
        });
        channelRef.current?.send({
          type: 'broadcast',
          event: 'RESET_GAME',
          payload: {},
        });
      };

      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(playUrl || window.location.href + '/play')}&margin=6`;

      return (
        <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center p-4 sm:p-6 font-sans">
          {/* Header Banner */}
          <div className="w-full max-w-7xl flex flex-wrap justify-between items-center bg-slate-900/90 backdrop-blur p-4 sm:p-5 rounded-2xl shadow-xl border border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-rose-500/20 border border-rose-500/40 rounded-xl flex items-center justify-center text-3xl shadow-inner">
                🍗
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-rose-500">
                  DUCK RUSH - PANIC RACE 3D
                </h1>
                <p className="text-xs sm:text-sm text-slate-400">
                  ⚠️ <span className="text-rose-400 font-bold">PERINGATAN:</span> Bebek yang pertama sampai di ujung akan <span className="text-yellow-400 font-bold">MASUK KOBARAN API & BERHASIL DIPANGGANG!</span> (Harus Presentasi! 🍗🔥)
                </p>
              </div>
            </div>

            <div className="flex items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
              <div className="text-right">
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">KODE ROOM</span>
                <span className="text-xl sm:text-2xl font-black text-cyan-400 font-mono tracking-widest">{roomCode}</span>
              </div>
              <div className="h-8 w-px bg-slate-700" />
              <div className="text-center">
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">PESERTA</span>
                <span className="text-xl sm:text-2xl font-black text-emerald-400 font-mono">
                  {Object.keys(players).length}
                </span>
              </div>
            </div>
          </div>

          {/* LOBBY VIEW */}
          {gameState === 'LOBBY' && (
            <div className="flex flex-col lg:flex-row items-stretch gap-6 mt-8 max-w-5xl w-full">
              {/* Kolom Kiri: QR Code */}
              <div className="flex-1 bg-slate-900/80 border border-slate-800 p-6 sm:p-8 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl relative overflow-hidden">
                <span className="text-xs font-bold text-cyan-400 tracking-wider uppercase mb-2">Scan Kamera HP</span>
                <h2 className="text-2xl font-black mb-4">Gabung Balapan Sekarang!</h2>

                <div className="p-3 bg-white rounded-2xl shadow-2xl border-4 border-cyan-400/40 mb-4 transition transform hover:scale-105 duration-200">
                  <img
                    src={qrImageUrl}
                    alt="QR Code Masuk Balapan Bebek"
                    className="w-48 h-48 sm:w-56 sm:h-56 rounded-lg object-contain"
                  />
                </div>

                <p className="text-xs text-slate-400 mb-2">Atau buka link ini di HP:</p>
                <a
                  href="/icebreaking/play"
                  target="_blank"
                  className="text-sm font-mono text-yellow-400 hover:text-yellow-300 font-bold bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700"
                >
                  {playUrl || '/icebreaking/play'}
                </a>
              </div>

              {/* Kolom Kanan: Peserta */}
              <div className="flex-1 bg-slate-900/80 border border-slate-800 p-6 sm:p-8 rounded-3xl flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-slate-200">
                      Lobby Peserta ({Object.keys(players).length})
                    </h3>
                    <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">
                      ● Siap Main
                    </span>
                  </div>

                  {Object.keys(players).length === 0 ? (
                    <div className="py-12 flex flex-col items-center justify-center text-slate-500">
                      <div className="text-5xl animate-bounce mb-3">🦆</div>
                      <p className="text-sm font-medium">Menunggu peserta scan QR code...</p>
                      <p className="text-xs text-slate-600 mt-1">Gunakan HP untuk masuk ke lobby balapan</p>

                  ) : (

                      {Object.values(players).map((p) => {
                        const duckMeta = DUCK_ASSETS.find((d) => d.id === p.duckId) || DUCK_ASSETS[0];
                        return (

                            >

                                #{p.duckId} {duckMeta.name}

                          </div>
                        );
                      })}

                </div>

                <div className="pt-4 border-t border-slate-800">
                  <button

                    disabled={Object.keys(players).length === 0}
                    className="w-full py-4 bg-gradient-to-r from-yellow-400 via-amber-400 to-rose-500 hover:from-yellow-300 hover:to-rose-400 text-slate-950 font-black text-lg tracking-wider rounded-2xl shadow-xl hover:shadow-rose-500/20 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed transform active:scale-[0.98]"
                  >
                    MULAI BALAPAN 🏁🔥
                  </button>
                  <p className="text-center text-[11px] text-slate-500 mt-2">
                    Minimal 1 pemain untuk memulai sesi game
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* RACING VIEW */}
          {gameState === 'RACING' && (
            <div className="w-full max-w-7xl mt-4 flex flex-col gap-4">
              {/* Soal & Danger Tracker */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                {/* Live Blitz Battle Arena Dashboard */}
                <div className="lg:col-span-2 bg-slate-900 border-2 border-slate-800 p-4 sm:p-5 rounded-2xl flex flex-col justify-between shadow-xl gap-3">
                  <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2.5">
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-black uppercase tracking-widest text-cyan-400 bg-cyan-400/10 px-2.5 py-1 rounded-full border border-cyan-400/30 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                        ⚡ LIVE BLITZ ARENA
                      </span>
                      <span className="text-xs text-slate-300 font-bold hidden sm:inline">
                        Setiap pemain menjawab soal acak unik (5 detik per soal)
                      </span>
                    </div>

                    <div className="flex items-center gap-3 text-xs font-mono">
                      <span className="bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-yellow-400 font-bold">
                        📊 {stats.totalAnswered} Dijawab
                      </span>
                      <span className="bg-emerald-500/20 px-2.5 py-1 rounded-lg border border-emerald-500/40 text-emerald-300 font-bold">
                        🎯 {stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 100}% Akurat
                      </span>
                    </div>
                  </div>

                  {/* Realtime Action Stream Ticker */}
                  <div className="flex flex-col gap-1.5 min-h-[56px] justify-center">
                    <span className="text-[10px] text-slate-400 uppercase font-black tracking-wider flex items-center gap-1">
                      <span>📡</span> AKTIVITAS JAWABAN TERBARU:
                    </span>
                    {recentEvents.length === 0 ? (
                      <div className="text-xs text-slate-400 italic py-1 flex items-center gap-2">
                        <span className="animate-spin text-sm">⏳</span> Menunggu jawaban pertama dari HP mahasiswa...
                      </div>
                    ) : (
                      <div className="flex flex-wrap items-center gap-2">
                        {recentEvents.slice(0, 4).map((evt) => {
                          const duckMeta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === evt.duckId))
                            || DUCK_ASSETS.find((d) => d.id === evt.duckId) || DUCK_ASSETS[0];
                          return (
                            <div
                              key={evt.id}
                              className={`text-xs px-2.5 py-1 rounded-xl border flex items-center gap-1.5 shadow animate-in fade-in zoom-in-95 duration-150 ${
                                evt.isCorrect
                                  ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
                                  : evt.reason === 'TIMEOUT'
                                  ? 'bg-amber-500/15 border-amber-500/40 text-amber-300'
                                  : 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                              }`}
                            >
                              <span>{duckMeta.emoji}</span>
                              <span className="font-bold text-white max-w-[120px] truncate">{evt.name}</span>
                              <span className="font-black text-[11px]">
                                {evt.isCorrect ? 'BENAR 🛑 (Ngerem)' : evt.reason === 'TIMEOUT' ? 'TIMEOUT ⏱️ (+2.2%)' : 'SALAH 🔥 (+2.2%)'}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                {/* Live Danger Board (Bebek Terdepan / Terancam Dipanggang) */}
                <div className="bg-gradient-to-r from-rose-950/70 to-slate-900 border-2 border-rose-500/50 p-4 rounded-2xl flex flex-col justify-between shadow-xl">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-black text-rose-400 uppercase tracking-wider flex items-center gap-1.5">
                      <span className="animate-ping inline-block w-2 h-2 rounded-full bg-rose-500"></span>
                      🔥 TERANCAM KEPANGGANG
                    </span>
                    <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full font-bold">
                      Live Ranking
                    </span>
                  </div>

                  <div className="flex items-center gap-2 text-xs">
                    {leaderboard.slice(0, 3).map((p, idx) => {
                      const duckMeta = DUCK_ASSETS.find((d) => d.id === p.duckId) || DUCK_ASSETS[0];
                      const badges = ['🥇', '🥈', '🥉'];
                      return (
                        <div key={p.id} className="flex-1 bg-slate-800/80 border border-slate-700 p-2 rounded-xl text-center">
                          <span className="text-xs block">{badges[idx]} #{idx + 1}</span>
                          <span className="text-sm block">{duckMeta.emoji}</span>
                          <p className="font-bold text-[11px] text-white truncate">{p.name}</p>
                          <span className="text-[9px] font-mono text-rose-300 font-bold block">
                            {Math.round(p.progress || 0)}%
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* THREE.JS 3D RACE ARENA DENGAN KOBARAN API FINISH */}
              <ThreeRaceArena players={players} leaderboard={leaderboard} gameState={gameState} />
            </div>
          )}

          {/* MODAL BEBEK BERHASIL DIPANGGANG */}
          {gameState === 'FINISHED' && loser && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-4 border-rose-500 p-7 sm:p-8 rounded-3xl max-w-lg w-full text-center shadow-2xl relative overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="inline-block p-4 bg-rose-500/20 border-2 border-rose-500/50 rounded-3xl mb-3 shadow-inner">
                  <span className="text-5xl animate-bounce inline-block">🍗🔥</span>
                </div>

                <div className="inline-block bg-rose-500/20 border border-rose-500 px-3 py-1 rounded-full text-xs font-black text-rose-300 uppercase tracking-widest mb-2">
                  MATANG SEMPURNA!
                </div>

                <h2 className="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-rose-400 to-amber-500 mb-2">
                  BEBEK KAMU BERHASIL DIPANGGANG!
                </h2>
                <p className="text-slate-300 text-xs sm:text-sm mb-5">
                  Aroma bebek panggang crispy semerbak ke seluruh ruangan! Bebek pertama yang masuk oven adalah:
                </p>

                <div className="bg-gradient-to-b from-rose-950/80 to-slate-950 p-5 rounded-2xl border-2 border-rose-500/80 mb-5 shadow-2xl relative">
                  {(() => {
                    const loserMeta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === loser.duckId))
                      || DUCK_ASSETS.find((d) => d.id === loser.duckId);
                    return (
                      <>
                        <div className="text-5xl mb-2">{loserMeta?.emoji || '🦆'} ➔ 🍗🔥</div>
                        <h3 className="text-2xl sm:text-3xl font-black text-white">{loser.name}</h3>
                        <p className="text-sm text-yellow-400 font-bold mt-1">
                          #{loser.duckId} {loserMeta?.name || 'Bebek'} ({loserMeta?.title || 'Peserta'})
                        </p>
                        <p className="text-xs text-rose-300 italic mt-1 font-medium">
                          "{loserMeta?.desc || 'Bebek gosong crispy pertama yang masuk oven!'}"
                        </p>
                      </>
                    );
                  })()}
                </div>

                <div className="bg-amber-500/20 border-2 border-amber-400 p-4 rounded-2xl mb-6">
                  <p className="text-amber-300 font-black text-xs uppercase tracking-wider">
                    🎤 KARENA BEBEKMU GOSONG PALING PERTAMA:
                  </p>
                  <p className="text-white font-extrabold text-base mt-1">
                    Silakan maju ke depan kelas dan mulai presentasi!
                  </p>
                </div>

                <button
                  onClick={resetGame}
                  className="w-full py-4 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-base rounded-2xl shadow-xl transition transform active:scale-98"
                >
                  🔄 Panggang Bebek Lain (Main Ronde Baru)
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<HostApp />);
    } catch (e) {
      console.error('Render error:', e);
    }
  </script>
</body>
</html>
