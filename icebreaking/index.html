    // Helper untuk mengacak pertanyaan & opsi pilihan jawaban
    function generateShuffledQuestions() {
      const deck = [...QUESTION_BANK];
      // Fisher-Yates shuffle array pertanyaan
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      // Acak urutan 4 opsi jawaban tiap soal agar posisi jawaban benar tidak statis
      return deck.map((item) => {
        const originalCorrectText = item.options[item.correct];
        const randomizedOptions = [...item.options];
        for (let i = randomizedOptions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [randomizedOptions[i], randomizedOptions[j]] = [randomizedOptions[j], randomizedOptions[i]];
        }
        const newCorrectIdx = randomizedOptions.indexOf(originalCorrectText);
        return {
          q: item.q,
          options: randomizedOptions,
          correct: newCorrectIdx,
        };
      });
    }

    // Helper resolusi client Supabase dengan safe fallback
    async function initSupabase() {
      let url = window.__SUPABASE_CONFIG__?.url;
      let key = window.__SUPABASE_CONFIG__?.anonKey;

      if (!url || !key) {
        try {
          const res = await fetch('/api/poll-config');
          if (res.ok) {
            const data = await res.json();
            if (data && data.isConfigured) {
              url = data.supabaseUrl;
              key = data.supabaseAnonKey;
            }
          }
        } catch (e) {}
      }

      const clientFactory = window.supabase?.createClient;
      if (typeof clientFactory === 'function' && url && key && url.startsWith('https://') && key.length > 20) {
        try {
          return clientFactory(url, key);
        } catch (e) {
          console.warn('Gagal konek Supabase, menggunakan fallback:', e);
        }
      }

      // Safe Fallback BroadcastChannel (in-browser real-time across tabs)
      let bc = null;
      try {
        bc = new BroadcastChannel('game_BEBEK-SERU');
      } catch (e) {}

      const listeners = { broadcast: [], presence: [] };
      const presenceState = new Map();

      if (bc) {
        bc.onmessage = (e) => {
          const { type, event, payload } = e.data || {};
          if (type === 'broadcast') {
            listeners.broadcast.forEach(fn => fn({ event, payload }));
          } else if (type === 'track') {
            presenceState.set(payload.id, payload);
            listeners.presence.forEach(fn => fn());
          }
        };
      }

      return {
        channel: (name) => {
          const ch = {
            on: function(kind, filter, cb) {
              const callback = typeof filter === 'function' ? filter : cb;
              if (kind === 'presence') listeners.presence.push(callback);
              if (kind === 'broadcast') {
                listeners.broadcast.push((msg) => {
                  if (!filter || !filter.event || filter.event === msg.event) {
                    callback(msg);
                  }
                });
              }
              return ch;
            },
            presenceState: () => {
              const out = {};
              presenceState.forEach((val, k) => { out[k] = [val]; });
              return out;
            },
            send: (msg) => {
              if (bc) bc.postMessage(msg);
              return 'ok';
            },
            subscribe: () => ch,
          };
          return ch;
        },
        removeChannel: () => {
          if (bc) bc.close();
        }
      };
    }

    function HostApp() {
      const [roomCode] = useState('BEBEK-SERU');
      const [players, setPlayers] = useState({});
      const [gameState, setGameState] = useState('LOBBY'); // LOBBY, RACING, FINISHED
      const [questions, setQuestions] = useState(() => generateShuffledQuestions());
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(6);
      const [loser, setLoser] = useState(null);
      const [playUrl, setPlayUrl] = useState('');
      const [leaderboard, setLeaderboard] = useState([]);

      const channelRef = useRef(null);
      const rankBroadcastTickRef = useRef(0);

      useEffect(() => {
        const fullUrl = `${window.location.origin}/icebreaking/play`;
        setPlayUrl(fullUrl);

        let activeChannel = null;

        initSupabase().then((client) => {
          const channel = client.channel(`game_${roomCode}`, {
            config: { presence: { key: 'host' } },
          });

          channel.on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            setPlayers((prev) => {
              const updated = { ...prev };
              Object.values(state).flat().forEach((p) => {
                if (p && p.id && !updated[p.id]) {
                  updated[p.id] = {
                    id: p.id,
                    name: p.name || `Pemain #${p.duckId || 1}`,
                    duckId: p.duckId || 1,
                    progress: 0,
                    speedFactor: 1,
                  };
                }
              });
              return updated;
            });
          });

          channel.on('broadcast', { event: 'SUBMIT_ANSWER' }, ({ payload }) => {
            const { playerId, isCorrect } = payload || {};
            setPlayers((prev) => {
              if (!prev[playerId]) return prev;
              return {
                ...prev,
                [playerId]: {
                  ...prev[playerId],
                  // Salah = Ngebut panik (2.2x), Benar = Ngerem aman (0.08x)
                  speedFactor: isCorrect ? 0.08 : 2.2,
                },
              };
            });

            // Efek rem / boost aktif selama 2.8 detik
            setTimeout(() => {
              setPlayers((prev) => {
                if (!prev[playerId]) return prev;
                return {
                  ...prev,
                  [playerId]: { ...prev[playerId], speedFactor: 1 },
                };
              });
            }, 2800);
          });

          channel.subscribe();
          channelRef.current = channel;
          activeChannel = channel;
        });

        return () => {
          if (activeChannel && activeChannel.unsubscribe) {
            activeChannel.unsubscribe();
          }
        };
      }, [roomCode]);

      // Game Loop: Jalur Lebih Panjang & Endurance (Tick 50ms)
      useEffect(() => {
        if (gameState !== 'RACING') return;

        const interval = setInterval(() => {
          setPlayers((prev) => {
            let firstFinished = null;
            const updated = { ...prev };
            const ids = Object.keys(updated);

            if (ids.length === 0) return prev;

            // Base increment 0.075 per tick: Balapan berlangsung ~60-80 detik (jalur jauh lebih panjang & intens)
            const baseIncrement = 0.075;

            ids.forEach((id) => {
              const current = updated[id];
              const increment = baseIncrement * (current.speedFactor || 1);
              const newProgress = Math.min(100, (current.progress || 0) + increment);

              updated[id] = { ...current, progress: newProgress };

              if (newProgress >= 100 && !firstFinished) {
                firstFinished = updated[id];
              }
            });

            // Hitung Ranking Realtime untuk Dikirim ke HP Mahasiswa
            const sortedByDanger = Object.values(updated)
              .sort((a, b) => (b.progress || 0) - (a.progress || 0));

            setLeaderboard(sortedByDanger);

            // Broadcast posisi ranking ke semua HP setiap ~400ms (tiap 8 ticks)
            rankBroadcastTickRef.current += 1;
            if (rankBroadcastTickRef.current % 8 === 0) {
              const rankMap = {};
              const total = sortedByDanger.length;
              sortedByDanger.forEach((p, idx) => {
                rankMap[p.id] = {
                  rank: idx + 1,
                  total,
                  progress: Math.min(100, Math.round(p.progress || 0)),
                  ahead: idx > 0 ? sortedByDanger[idx - 1].name : null,
                  behind: idx < total - 1 ? sortedByDanger[idx + 1].name : null,
                  leaderName: sortedByDanger[0]?.name || '',
                };
              });

              channelRef.current?.send({
                type: 'broadcast',
                event: 'RACE_UPDATE',
                payload: { rankMap },
              });
            }

            if (firstFinished) {
              setGameState('FINISHED');
              setLoser(firstFinished);
              channelRef.current?.send({
                type: 'broadcast',
                event: 'GAME_OVER',
                payload: { loser: firstFinished },
              });

              if (window.confetti) {
                window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
              }
            }

            return updated;
          });
        }, 50);

        return () => clearInterval(interval);
      }, [gameState]);

      // Timer 6 Detik per Soal Acak
      useEffect(() => {
        if (gameState !== 'RACING') return;

        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              const nextIndex = (currentQIndex + 1) % questions.length;
              setCurrentQIndex(nextIndex);
              channelRef.current?.send({
                type: 'broadcast',
                event: 'NEXT_QUESTION',
                payload: { question: questions[nextIndex], index: nextIndex },
              });
              return 6;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [gameState, currentQIndex, questions]);

      const startGame = () => {
        // Acak kumpulan soal dan opsi baru setiap kali game dimulai
        const freshQuestions = generateShuffledQuestions();
        setQuestions(freshQuestions);
        setGameState('RACING');
        setTimeLeft(6);
        setCurrentQIndex(0);
        channelRef.current?.send({
          type: 'broadcast',
          event: 'START_GAME',
          payload: { question: freshQuestions[0], index: 0 },
        });
      };

      const resetGame = () => {
        // Reset soal baru secara acak
        const freshQuestions = generateShuffledQuestions();
        setQuestions(freshQuestions);
        setGameState('LOBBY');
        setLoser(null);
        setCurrentQIndex(0);
        setTimeLeft(6);
        setPlayers((prev) => {
          const reset = {};
          Object.keys(prev).forEach((id) => {
            reset[id] = { ...prev[id], progress: 0, speedFactor: 1 };
          });
          return reset;
        });
      };

      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(playUrl || window.location.href + '/play')}&margin=6`;

      return (
        <div className="min-h-screen bg-slate-950 text-white flex flex-col items-center p-4 sm:p-6 font-sans">
          {/* Header Banner */}
          <div className="w-full max-w-6xl flex flex-wrap justify-between items-center bg-slate-900/90 backdrop-blur p-4 sm:p-5 rounded-2xl shadow-xl border border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-yellow-400/20 border border-yellow-400/40 rounded-xl flex items-center justify-center text-3xl shadow-inner">
                🦆
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500">
                  DUCK RUSH - PANIC RACE
                </h1>
                <p className="text-xs sm:text-sm text-slate-400">
                  ⚠️ <span className="text-rose-400 font-bold">PERINGATAN:</span> Bebek yang pertama sampai finish (Juara 1) HARUS PRESENTASI!
                </p>
              </div>
            </div>

            <div className="flex items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
              <div className="text-right">
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">KODE ROOM</span>
                <span className="text-xl sm:text-2xl font-black text-cyan-400 font-mono tracking-widest">{roomCode}</span>
              </div>
              <div className="h-8 w-px bg-slate-700" />
              <div className="text-center">
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">PESERTA</span>
                <span className="text-xl sm:text-2xl font-black text-emerald-400 font-mono">
                  {Object.keys(players).length}
                </span>
              </div>
            </div>
          </div>

          {/* LOBBY VIEW */}
          {gameState === 'LOBBY' && (
            <div className="flex flex-col lg:flex-row items-stretch gap-6 mt-8 max-w-5xl w-full">
              {/* Kolom Kiri: QR Code */}
              <div className="flex-1 bg-slate-900/80 border border-slate-800 p-6 sm:p-8 rounded-3xl flex flex-col items-center justify-center text-center shadow-2xl relative overflow-hidden">
                <span className="text-xs font-bold text-cyan-400 tracking-wider uppercase mb-2">Scan Kamera HP</span>
                <h2 className="text-2xl font-black mb-4">Gabung Balapan Sekarang!</h2>

                <div className="p-3 bg-white rounded-2xl shadow-2xl border-4 border-cyan-400/40 mb-4 transition transform hover:scale-105 duration-200">
                  <img
                    src={qrImageUrl}
                    alt="QR Code Masuk Balapan Bebek"
                    className="w-48 h-48 sm:w-56 sm:h-56 rounded-lg object-contain"
                  />
                </div>

                <p className="text-xs text-slate-400 mb-2">Atau buka link ini di HP:</p>
                <a
                  href="/icebreaking/play"
                  target="_blank"
                  className="text-sm font-mono text-yellow-400 hover:text-yellow-300 font-bold bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700"
                >
                  {playUrl || '/icebreaking/play'}
                </a>
              </div>

              {/* Kolom Kanan: Peserta */}
              <div className="flex-1 bg-slate-900/80 border border-slate-800 p-6 sm:p-8 rounded-3xl flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-slate-200">
                      Lobby Peserta ({Object.keys(players).length})
                    </h3>
                    <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">
                      ● Siap Main
                    </span>
                  </div>

                  {Object.keys(players).length === 0 ? (
                    <div className="py-12 flex flex-col items-center justify-center text-slate-500">
                      <div className="text-5xl animate-bounce mb-3">🦆</div>
                      <p className="text-sm font-medium">Menunggu peserta scan QR code...</p>
                      <p className="text-xs text-slate-600 mt-1">Gunakan HP untuk masuk ke lobby balapan</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-64 overflow-y-auto p-1 pr-2 mb-6">
                      {Object.values(players).map((p) => {
                        const duckMeta = DUCK_ASSETS.find((d) => d.id === p.duckId) || DUCK_ASSETS[0];
                        return (
                          <div
                            key={p.id}
                            className="bg-slate-800/90 border border-slate-700/80 p-2.5 rounded-xl flex items-center gap-2 shadow-sm"
                          >
                            <div
                              className="w-8 h-8 rounded-lg flex items-center justify-center text-lg border"
                              style={{ backgroundColor: `${duckMeta.color}33`, borderColor: duckMeta.border }}
                            >
                              {duckMeta.emoji}
                            </div>
                            <div className="overflow-hidden">
                              <p className="text-xs font-bold text-white truncate">{p.name}</p>
                              <p className="text-[10px] text-slate-400">#{p.duckId}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                <div className="pt-4 border-t border-slate-800">
                  <button
                    onClick={startGame}
                    disabled={Object.keys(players).length === 0}
                    className="w-full py-4 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-lg tracking-wider rounded-2xl shadow-xl hover:shadow-yellow-500/20 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed transform active:scale-[0.98]"
                  >
                    MULAI BALAPAN 🏁
                  </button>
                  <p className="text-center text-[11px] text-slate-500 mt-2">
                    Minimal 1 pemain untuk memulai sesi game
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* RACING VIEW */}
          {gameState === 'RACING' && (
            <div className="w-full max-w-7xl mt-4 flex flex-col gap-4">
              {/* Soal & Danger Tracker */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                {/* Kotak Soal Aktif */}
                <div className="lg:col-span-2 bg-slate-900 border-2 border-slate-800 p-4 sm:p-5 rounded-2xl flex flex-wrap justify-between items-center shadow-xl gap-4">
                  <div className="flex-1 min-w-[240px]">
                    <div className="flex items-center gap-2 mb-1.5">
                      <span className="text-[10px] font-black uppercase tracking-widest text-yellow-400 bg-yellow-400/10 px-2 py-0.5 rounded border border-yellow-400/30">
                        PERTANYAAN #{currentQIndex + 1}
                      </span>
                      <span className="text-xs text-slate-400">Jawab BENAR = Ngerem aman | Jawab SALAH = Auto ngebut panik!</span>
                    </div>
                    <h3 className="text-xl sm:text-2xl font-black text-white leading-snug">
                      {questions[currentQIndex]?.q}
                    </h3>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <span className="text-[10px] text-slate-400 uppercase font-bold block">Ganti Soal</span>
                      <span className="text-xs text-yellow-400 font-mono font-bold">Detik</span>
                    </div>
                    <div className="w-14 h-14 rounded-2xl bg-yellow-400/10 border-2 border-yellow-400 flex items-center justify-center text-2xl font-black text-yellow-400 shadow-lg shadow-yellow-500/10 animate-pulse">
                      {timeLeft}
                    </div>
                  </div>
                </div>

                {/* Live Danger Board (Bebek Terdepan / Terancam Presentasi) */}
                <div className="bg-gradient-to-r from-rose-950/60 to-slate-900 border-2 border-rose-500/40 p-4 rounded-2xl flex flex-col justify-between shadow-xl">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-black text-rose-400 uppercase tracking-wider flex items-center gap-1.5">
                      <span className="animate-ping inline-block w-2 h-2 rounded-full bg-rose-500"></span>
                      🚨 TERANCAM MAJU PRESENTASI
                    </span>
                    <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full font-bold">
                      Live Ranking
                    </span>
                  </div>

                  <div className="flex items-center gap-2 text-xs">
                    {leaderboard.slice(0, 3).map((p, idx) => {
                      const duckMeta = DUCK_ASSETS.find((d) => d.id === p.duckId) || DUCK_ASSETS[0];
                      const badges = ['🥇', '🥈', '🥉'];
                      return (
                        <div key={p.id} className="flex-1 bg-slate-800/80 border border-slate-700 p-2 rounded-xl text-center">
                          <span className="text-xs block">{badges[idx]} #{idx + 1}</span>
                          <span className="text-sm block">{duckMeta.emoji}</span>
                          <p className="font-bold text-[11px] text-white truncate">{p.name}</p>
                          <span className="text-[9px] font-mono text-rose-300 font-bold block">
                            {Math.round(p.progress || 0)}%
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* LINTASAN SUNGAI EKSTRA PANJANG (500 METER) */}
              <div className="relative w-full min-h-[520px] h-[calc(65px_*_10)] max-h-[640px] bg-gradient-to-r from-blue-950 via-cyan-900 to-blue-950 rounded-3xl overflow-hidden border-4 border-cyan-950 shadow-2xl flex flex-col justify-around p-3">
                <div className="absolute inset-0 water-flow opacity-30 pointer-events-none" />

                {/* Garis & Penanda Jarak (0m, 125m, 250m, 375m, 500m) */}
                <div className="absolute inset-0 pointer-events-none flex justify-between px-6 z-0">
                  <div className="h-full border-r border-cyan-400/20 flex flex-col justify-between py-2 text-[10px] font-mono text-cyan-400/60">
                    <span>0m</span>
                    <span>START</span>
                  </div>
                  <div className="h-full border-r border-dashed border-cyan-400/25 flex flex-col justify-between py-2 text-[10px] font-mono text-cyan-300/70">
                    <span>125m</span>
                    <span>JERAM 🌊</span>
                  </div>
                  <div className="h-full border-r border-dashed border-yellow-400/30 flex flex-col justify-between py-2 text-[10px] font-mono text-yellow-300/80">
                    <span>250m</span>
                    <span>PUSARAN 🌀</span>
                  </div>
                  <div className="h-full border-r border-dashed border-rose-400/40 flex flex-col justify-between py-2 text-[10px] font-mono text-rose-300/80">
                    <span>375m</span>
                    <span>BAHAYA ⚠️</span>
                  </div>
                  <div className="h-full w-24"></div>
                </div>

                {/* Garis Finish */}
                <div className="absolute right-12 top-0 bottom-0 w-12 bg-[repeating-conic-gradient(#0f172a_0%_25%,#ffffff_0%_50%)] [background-size:20px_20px] border-l-4 border-yellow-400 z-20 flex items-center justify-center shadow-2xl">
                  <span className="[writing-mode:vertical-lr] font-black text-slate-950 bg-yellow-400 px-1 py-3 text-xs tracking-widest rounded shadow uppercase border border-yellow-500">
                    FINISH (500M) 🎤
                  </span>
                </div>

                {/* Jalur Bebek */}
                <div className="relative z-10 w-full h-full flex flex-col justify-around">
                  {Object.values(players).map((p, idx) => {
                    const duckMeta = DUCK_ASSETS.find((d) => d.id === p.duckId) || DUCK_ASSETS[idx % 10];
                    const meters = Math.round((p.progress || 0) * 5); // 0 sampai 500 meter
                    return (
                      <div
                        key={p.id}
                        className="relative w-full h-11 flex items-center border-b border-cyan-400/15"
                      >
                        <div
                          className="absolute transition-all duration-100 ease-linear flex items-center gap-2"
                          style={{
                            left: `calc(${p.progress}% * 0.85)`,
                          }}
                        >
                          <div
                            className="relative w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-lg border-2 overflow-hidden select-none"
                            style={{
                              backgroundColor: duckMeta.color,
                              borderColor: duckMeta.border,
                            }}
                          >
                            <span>{duckMeta.emoji}</span>
                            <span className="absolute bottom-0 right-0 text-[8px] bg-black/70 text-white font-black px-1 rounded-tl">
                              #{p.duckId}
                            </span>
                          </div>

                          <div className="bg-slate-900/95 text-white px-2.5 py-1 rounded-lg text-xs font-bold whitespace-nowrap shadow-md border border-slate-700 flex items-center gap-1.5">
                            <span>{p.name}</span>
                            <span className="text-[10px] font-mono text-cyan-300 font-normal">
                              ({meters}m)
                            </span>
                          </div>

                          {p.speedFactor < 1 && (
                            <span className="text-[10px] font-black text-emerald-300 bg-emerald-950/90 px-2 py-0.5 rounded-full border border-emerald-500 animate-bounce shadow">
                              🛑 REM!
                            </span>
                          )}
                          {p.speedFactor > 1 && (
                            <span className="text-[10px] font-black text-rose-300 bg-rose-950/90 px-2 py-0.5 rounded-full border border-rose-500 animate-pulse shadow">
                              🔥 NGEBUT PANIK!
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* MODAL PRESENTASI */}
          {gameState === 'FINISHED' && loser && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border-2 border-yellow-400 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl relative overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                <div className="inline-block p-3 bg-yellow-400/10 border border-yellow-400/30 rounded-2xl mb-4">
                  <span className="text-4xl">🏆 🦆</span>
                </div>

                <h2 className="text-3xl font-black text-yellow-400 mb-1">JUARA 1 TERCEPAT!</h2>
                <p className="text-slate-300 text-xs sm:text-sm mb-6">
                  Bebek pertama yang berhasil menembus arus dan melewati garis finish adalah:
                </p>

                <div className="bg-slate-800/90 p-5 rounded-2xl border border-slate-700 mb-6 shadow-inner">
                  <div className="text-5xl mb-2">🦆</div>
                  <h3 className="text-2xl font-black text-white">{loser.name}</h3>
                  <p className="text-xs text-yellow-400 font-bold mt-1">Bebek #{loser.duckId}</p>
                </div>

                <div className="bg-rose-500/10 border border-rose-500/40 p-3.5 rounded-xl mb-6">
                  <p className="text-rose-400 font-extrabold text-sm">
                    🎤 Silakan maju ke depan kelas dan mulai presentasi materi!
                  </p>
                </div>

                <button
                  onClick={resetGame}
                  className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-xl text-sm font-bold transition border border-slate-700"
                >
                  🔄 Kembali ke Lobby (Main Lagi)
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<HostApp />);
    } catch (e) {
      console.error('Render error:', e);
    }
  </script>
</body>
</html>
