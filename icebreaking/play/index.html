<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DUCK RUSH - Layar Pemain HP</title>
  <meta name="description" content="Layar HP Mahasiswa untuk Balapan Bebek Duck Rush Panic Race" />
  <link rel="icon" type="image/svg+xml" href="/ducks/duck_1.svg" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- External Libraries -->
  <script src="/poll-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body class="bg-slate-950 text-white min-h-screen selection:bg-yellow-400 selection:text-black font-sans">
  <div id="root">
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="text-6xl animate-bounce mb-4">🦆</div>
      <h1 class="text-xl font-black text-yellow-400 mb-2">Menyiapkan Arena Bebek...</h1>
      <p class="text-xs text-slate-400">Silakan tunggu sebentar</p>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DUCK_OPTIONS = (typeof window !== 'undefined' && window.DUCK_CHARACTERS) ? window.DUCK_CHARACTERS : [
      { id: 1, name: 'Bebek Klasik Berdasi', color: '#FACC15', border: '#CA8A04', emoji: '🎩' },
      { id: 2, name: 'Bebek Sultan Emas', color: '#EAB308', border: '#A16207', emoji: '👑' },
      { id: 3, name: 'Bebek Zombie Biohazard', color: '#4ADE80', border: '#15803D', emoji: '🧟' },
      { id: 4, name: 'Bebek Ninja Bayangan', color: '#475569', border: '#0F172A', emoji: '🥷' },
      { id: 5, name: 'Bebek Cyborg 2077', color: '#38BDF8', border: '#0284C7', emoji: '🤖' },
      { id: 6, name: 'Bebek Bajak Laut', color: '#EA580C', border: '#9A3412', emoji: '🏴‍☠️' },
      { id: 7, name: 'Bebek Penyihir Astral', color: '#A855F7', border: '#6B21A8', emoji: '🧙‍♂️' },
      { id: 8, name: 'Bebek Astronaut Apollo', color: '#E2E8F0', border: '#38BDF8', emoji: '🚀' },
      { id: 9, name: 'Bebek Gamer Retro RGB', color: '#F43F5E', border: '#BE123C', emoji: '🎧' },
      { id: 10, name: 'Bebek Naga Magma Api', color: '#DC2626', border: '#7F1D1D', emoji: '🔥' },
    ];

    // Komponen Preview Interaktif 3D Bebek Three.js untuk Layar Pemain
    function Duck3DPreview({ duckId }) {
      const mountRef = useRef(null);
      const duckObjRef = useRef(null);
      const isDraggingRef = useRef(false);
      const prevXRef = useRef(0);
      const userRotRef = useRef(0);
      const rotVelRef = useRef(0);
      const rimLightRef = useRef(null);
      const ringMatRef = useRef(null);

      const meta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === duckId))
        || DUCK_OPTIONS.find((d) => d.id === duckId)
        || DUCK_OPTIONS[0];

      useEffect(() => {
        const container = mountRef.current;
        if (!container || !window.THREE) return;

        const width = container.clientWidth || 320;
        const height = container.clientHeight || 220;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
        camera.position.set(0, 1.7, 5.2);
        camera.lookAt(0, 0.55, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.3);
        dirLight.position.set(4, 7, 5);
        scene.add(dirLight);

        const accentHex = parseInt((meta.color || '#38bdf8').replace('#', '0x'), 16) || 0x38bdf8;
        const rimLight = new THREE.PointLight(accentHex, 2.0, 18);
        rimLight.position.set(-4, 3, -3);
        scene.add(rimLight);
        rimLightRef.current = rimLight;

        // Pedestal Panggung Air
        const pedestal = new THREE.Group();
        const discMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          roughness: 0.35,
          metalness: 0.7,
        });
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.65, 1.75, 0.12, 32), discMat);
        disc.position.y = -0.06;
        pedestal.add(disc);

        const ringHex = parseInt((meta.border || meta.color || '#facc15').replace('#', '0x'), 16) || 0xfacc15;
        const ringMat = new THREE.MeshBasicMaterial({ color: ringHex });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.68, 0.025, 8, 36), ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.01;
        pedestal.add(ring);
        ringMatRef.current = ringMat;

        scene.add(pedestal);

        // Spawn Duck Mesh
        function spawnDuckMesh(idToSpawn) {
          if (duckObjRef.current) {
            scene.remove(duckObjRef.current);
          }
          const curMeta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === idToSpawn))
            || DUCK_OPTIONS.find((d) => d.id === idToSpawn)
            || DUCK_OPTIONS[0];

          let duckObj;
          if (typeof window.createDuck3DMesh === 'function') {
            duckObj = window.createDuck3DMesh(curMeta, THREE, { castShadow: false });
          } else {
            const g = new THREE.Group();
            const col = parseInt((curMeta.color || '#facc15').replace('#', '0x'), 16);
            const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: col }));
            g.add(m);
            duckObj = { group: g };
          }

          const g = duckObj.group;
          g.position.set(0, 0.45, 0);
          g.scale.set(0.95, 0.95, 0.95);
          g.rotation.y = userRotRef.current;
          scene.add(g);
          duckObjRef.current = g;

          const nHex = parseInt((curMeta.border || curMeta.color || '#facc15').replace('#', '0x'), 16);
          if (rimLightRef.current) rimLightRef.current.color.setHex(nHex);
          if (ringMatRef.current) ringMatRef.current.color.setHex(nHex);
        }

        spawnDuckMesh(duckId);

        // Render Loop
        let animId = null;
        let clock = new THREE.Clock();

        function animate() {
          animId = requestAnimationFrame(animate);
          const elapsed = clock.getElapsedTime();

          if (duckObjRef.current) {
            if (!isDraggingRef.current) {
              userRotRef.current += 0.014 + rotVelRef.current;
              rotVelRef.current *= 0.92;
            }
            duckObjRef.current.rotation.y = userRotRef.current;
            duckObjRef.current.position.y = 0.46 + Math.sin(elapsed * 3.2) * 0.05;
            duckObjRef.current.rotation.z = Math.sin(elapsed * 2.2) * 0.02;
          }

          renderer.render(scene, camera);
        }

        animate();

        // Drag / Swipe Controls
        const onDown = (e) => {
          isDraggingRef.current = true;
          prevXRef.current = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          rotVelRef.current = 0;
        };

        const onMove = (e) => {
          if (!isDraggingRef.current) return;
          const curX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          const dx = curX - prevXRef.current;
          prevXRef.current = curX;
          userRotRef.current += dx * 0.02;
          rotVelRef.current = dx * 0.005;
        };

        const onUp = () => {
          isDraggingRef.current = false;
        };

        const dom = renderer.domElement;
        dom.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        dom.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onUp, { passive: true });

        const onResize = () => {
          if (!container) return;
          const nw = container.clientWidth;
          const nh = container.clientHeight;
          camera.aspect = nw / nh;
          camera.updateProjectionMatrix();
          renderer.setSize(nw, nh);
        };
        window.addEventListener('resize', onResize);

        return () => {
          cancelAnimationFrame(animId);
          dom.removeEventListener('mousedown', onDown);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          dom.removeEventListener('touchstart', onDown);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
          window.removeEventListener('resize', onResize);

          if (container.contains(dom)) {
            container.removeChild(dom);
          }
          renderer.dispose();
        };
      }, []);

      // Re-spawn saat duckId berubah dari selector
      useEffect(() => {
        if (!duckObjRef.current || !window.THREE) return;
        const scene = duckObjRef.current.parent;
        if (!scene) return;

        scene.remove(duckObjRef.current);
        const curMeta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === duckId))
          || DUCK_OPTIONS.find((d) => d.id === duckId)
          || DUCK_OPTIONS[0];

        let duckObj;
        if (typeof window.createDuck3DMesh === 'function') {
          duckObj = window.createDuck3DMesh(curMeta, THREE, { castShadow: false });
        } else {
          const g = new THREE.Group();
          const col = parseInt((curMeta.color || '#facc15').replace('#', '0x'), 16);
          const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: col }));
          g.add(m);
          duckObj = { group: g };
        }

        const g = duckObj.group;
        g.position.set(0, 0.45, 0);
        g.scale.set(0.95, 0.95, 0.95);
        g.rotation.y = userRotRef.current;
        scene.add(g);
        duckObjRef.current = g;

        const nHex = parseInt((curMeta.border || curMeta.color || '#facc15').replace('#', '0x'), 16);
        if (rimLightRef.current) rimLightRef.current.color.setHex(nHex);
        if (ringMatRef.current) ringMatRef.current.color.setHex(nHex);
      }, [duckId]);

      return (
        <div className="relative w-full rounded-2xl bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 border border-slate-800 overflow-hidden shadow-2xl">
          {/* Header Badge */}
          <div className="absolute top-2.5 left-3 right-3 flex justify-between items-center z-10 pointer-events-none">
            <span className={`text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full border ${meta.badgeClass || 'bg-yellow-400/20 text-yellow-300 border-yellow-400/30'}`}>
              {meta.tag || `Bebek #${duckId}`}
            </span>
            <span className="text-[10px] text-slate-400 bg-slate-950/80 px-2 py-0.5 rounded-full border border-slate-800 font-medium">
              👆 Putar 360°
            </span>
          </div>

          {/* 3D Canvas Mount Point */}
          <div
            ref={mountRef}
            className="w-full h-52 sm:h-56 cursor-grab active:cursor-grabbing touch-none flex items-center justify-center"
          ></div>

          {/* Info Card Bawah */}
          <div className="p-3 bg-slate-900/90 border-t border-slate-800/80 flex flex-col gap-1">
            <div className="flex items-center justify-between">
              <h4 className="text-sm font-extrabold text-white flex items-center gap-1.5">
                <span>{meta.emoji}</span>
                <span>{meta.name}</span>
              </h4>
              <span className="text-[11px] font-mono font-bold text-yellow-400">
                #{meta.id}
              </span>
            </div>
            <p className="text-[11px] text-slate-300 leading-snug font-normal">
              {meta.desc}
            </p>
          </div>
        </div>
      );
    }

    async function initSupabase() {
      let url = window.__SUPABASE_CONFIG__?.url;
      let key = window.__SUPABASE_CONFIG__?.anonKey;

      if (!url || !key) {
        try {
          const res = await fetch('/api/poll-config');
          if (res.ok) {
            const data = await res.json();
            if (data && data.isConfigured) {
              url = data.supabaseUrl;
              key = data.supabaseAnonKey;
            }
          }
        } catch (e) {}
      }

      const clientFactory = window.supabase?.createClient;
      if (typeof clientFactory === 'function' && url && key && url.startsWith('https://') && key.length > 20) {
        try {
          return clientFactory(url, key);
        } catch (e) {}
      }

      // Safe Fallback BroadcastChannel
      let bc = null;
      try {
        bc = new BroadcastChannel('game_BEBEK-SERU');
      } catch (e) {}

      const listeners = { broadcast: [] };

      if (bc) {
        bc.onmessage = (e) => {
          const { type, event, payload } = e.data || {};
          if (type === 'broadcast') {
            listeners.broadcast.forEach(fn => fn({ event, payload }));
          }
        };
      }

      return {
        channel: () => {
          const ch = {
            on: function(kind, filter, cb) {
              const callback = typeof filter === 'function' ? filter : cb;
              if (kind === 'broadcast') {
                listeners.broadcast.push((msg) => {
                  if (!filter || !filter.event || filter.event === msg.event) {
                    callback(msg);
                  }
                });
              }
              return ch;
            },
            track: async (presenceData) => {
              if (bc) bc.postMessage({ type: 'track', payload: presenceData });
              return 'ok';
            },
            send: (msg) => {
              if (bc) bc.postMessage(msg);
              return 'ok';
            },
            subscribe: (cb) => {
              if (cb) setTimeout(() => cb('SUBSCRIBED'), 20);
              return ch;
            },
          };
          return ch;
        },
        removeChannel: () => {
          if (bc) bc.close();
        }
      };
    }

    function PlayerApp() {
      const [roomCode] = useState('BEBEK-SERU');
      const [name, setName] = useState('');
      const [selectedDuck, setSelectedDuck] = useState(1);
      const [joined, setJoined] = useState(false);
      const [isJoining, setIsJoining] = useState(false);
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [hasAnswered, setHasAnswered] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [playerId] = useState(() => 'player_' + Math.random().toString(36).substring(2, 9));
      const [feedback, setFeedback] = useState(null);
      const [gameOverLoser, setGameOverLoser] = useState(null);
      const [rankInfo, setRankInfo] = useState(null); // { rank, total, progress, ahead, behind, leaderName }

      const channelRef = useRef(null);

      useEffect(() => {
        return () => {
          if (channelRef.current && channelRef.current.unsubscribe) {
            channelRef.current.unsubscribe();
          }
        };
      }, []);

      const joinGame = async () => {
        if (!name.trim() || isJoining) return;
        setIsJoining(true);

        try {
          const client = await initSupabase();
          const channel = client.channel(`game_${roomCode}`, {
            config: { presence: { key: playerId } },
          });

          channel
            .on('broadcast', { event: 'START_GAME' }, ({ payload }) => {
              setCurrentQuestion(payload.question);
              setHasAnswered(false);
              setSelectedOption(null);
              setFeedback(null);
              setGameOverLoser(null);
            })
            .on('broadcast', { event: 'NEXT_QUESTION' }, ({ payload }) => {
              setCurrentQuestion(payload.question);
              setHasAnswered(false);
              setSelectedOption(null);
              setFeedback(null);
            })
            .on('broadcast', { event: 'RACE_UPDATE' }, ({ payload }) => {
              const myData = payload?.rankMap?.[playerId];
              if (myData) {
                setRankInfo(myData);
              }
            })
            .on('broadcast', { event: 'GAME_OVER' }, ({ payload }) => {
              setCurrentQuestion(null);
              setGameOverLoser(payload?.loser || true);
            })
            .subscribe(async (status) => {
              if (status === 'SUBSCRIBED') {
                try {
                  await channel.track({
                    id: playerId,
                    name: name.trim(),
                    duckId: selectedDuck,
                  });
                } catch (e) {}
                setJoined(true);
                setIsJoining(false);
              }
            });

          channelRef.current = channel;
        } catch (err) {
          console.error(err);
          setJoined(true);
          setIsJoining(false);
        }
      };

      const handleAnswer = (optionIndex) => {
        if (hasAnswered || !currentQuestion) return;
        setHasAnswered(true);
        setSelectedOption(optionIndex);

        const isCorrect = optionIndex === currentQuestion.correct;
        setFeedback(isCorrect ? 'SLOWED' : 'BOOSTED');

        channelRef.current?.send({
          type: 'broadcast',
          event: 'SUBMIT_ANSWER',
          payload: {
            playerId,
            isCorrect,
          },
        });
      };

      const currentDuckMeta = DUCK_OPTIONS.find((d) => d.id === selectedDuck) || DUCK_OPTIONS[0];

      // Form Masuk Lobby
      if (!joined) {
        return (
          <div className="min-h-screen flex flex-col justify-center p-4 sm:p-6 max-w-md mx-auto">
            <div className="text-center mb-6">
              <div className="w-16 h-16 bg-yellow-400/20 border-2 border-yellow-400/50 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-3 shadow-lg shadow-yellow-500/10">
                🦆
              </div>
              <h1 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500">
                DUCK RUSH
              </h1>
              <p className="text-xs text-slate-400 mt-1">Layar Pemain HP - Bertahanlah dari Presentasi!</p>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col gap-5 shadow-2xl">
              <div>
                <label className="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">
                  Nama Lengkap / Panggilan
                </label>
                <input
                  type="text"
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Contoh: Budi Santoso"
                  maxLength={20}
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400 transition"
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                    Pilih Karakter Bebek 3D
                  </label>
                  <span className="text-xs font-bold text-yellow-400">
                    #{selectedDuck} {currentDuckMeta.name}
                  </span>
                </div>

                {/* Live Three.js 3D Duck Interactive Preview */}
                <div className="mb-3">
                  <Duck3DPreview duckId={selectedDuck} />
                </div>

                {/* 10 Duck Selection Buttons */}
                <div className="grid grid-cols-5 gap-2">
                  {DUCK_OPTIONS.map((duck) => {
                    const isSelected = selectedDuck === duck.id;
                    return (
                      <button
                        key={duck.id}
                        type="button"
                        onClick={() => setSelectedDuck(duck.id)}
                        className={`h-16 rounded-xl flex flex-col items-center justify-center border-2 transition-all duration-150 transform active:scale-95 relative overflow-hidden ${
                          isSelected
                            ? 'border-yellow-400 bg-gradient-to-b from-yellow-400/25 to-yellow-500/10 shadow-lg shadow-yellow-400/25 scale-[1.04] ring-2 ring-yellow-400/40'
                            : 'border-slate-800 bg-slate-950/80 hover:border-slate-700 hover:bg-slate-900'
                        }`}
                      >
                        {isSelected && (
                          <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
                        )}
                        <span className="text-xl drop-shadow">{duck.emoji}</span>
                        <span className="text-[10px] font-black text-slate-300 mt-0.5 truncate max-w-full px-1">
                          #{duck.id}
                        </span>
                      </button>
                    );
                  })}
                </div>

                <p className="text-[11px] text-center text-slate-500 mt-2 font-medium">
                  💡 Karakter 3D ini yang akan muncul di layar host proyektor saat balapan!
                </p>
              </div>

              <button
                onClick={joinGame}
                disabled={!name.trim() || isJoining}
                className="w-full mt-2 py-4 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 font-black text-base rounded-2xl transition shadow-lg shadow-yellow-500/10 disabled:opacity-40 disabled:cursor-not-allowed transform active:scale-[0.98]"
              >
                {isJoining ? 'MENGHUBUNGKAN...' : 'GABUNG KE LOBBY 🚀'}
              </button>
            </div>
          </div>
        );
      }

      // Layar Game HP
      return (
        <div className="min-h-screen flex flex-col p-4 max-w-md mx-auto">
          {/* Header Status */}
          <div className="flex justify-between items-center py-2 px-3 bg-slate-900 border border-slate-800 rounded-2xl mb-3 shadow-md gap-2">
            <div className="flex items-center gap-2.5 overflow-hidden">
              <div
                className="w-10 h-10 rounded-xl flex items-center justify-center text-xl border shrink-0 shadow-inner"
                style={{ backgroundColor: `${currentDuckMeta.color}33`, borderColor: currentDuckMeta.border }}
              >
                {currentDuckMeta.emoji}
              </div>
              <div className="overflow-hidden">
                <p className="text-xs font-bold text-white truncate">{name}</p>
                <span className="text-[10px] text-yellow-400 font-semibold block truncate">
                  #{selectedDuck} {currentDuckMeta.name}
                </span>
              </div>
            </div>

            {rankInfo ? (
              <div className={`px-2.5 py-1 rounded-xl text-xs font-black border flex items-center gap-1.5 ${
                rankInfo.rank === 1
                  ? 'bg-rose-500/20 border-rose-500 text-rose-300 animate-pulse'
                  : rankInfo.rank <= 3
                  ? 'bg-amber-500/20 border-amber-500 text-amber-300'
                  : 'bg-emerald-500/20 border-emerald-500 text-emerald-300'
              }`}>
                <span>{rankInfo.rank === 1 ? '🚨' : rankInfo.rank <= 3 ? '⚠️' : '🛡️'}</span>
                <span>POSISI #{rankInfo.rank} / {rankInfo.total}</span>
              </div>
            ) : (
              <span className="text-[11px] bg-slate-800 border border-slate-700 text-slate-400 font-semibold px-2 py-0.5 rounded-lg">
                Room {roomCode}
              </span>
            )}
          </div>

          {/* KARTU STATUS KEPANIKAN REALTIME (POSISI & JARAK MENUJU OVEN) */}
          {rankInfo && (
            <div className={`rounded-2xl p-3 mb-3 border-2 shadow-lg transition-all duration-200 ${
              rankInfo.rank === 1
                ? 'bg-gradient-to-r from-rose-950 via-red-950 to-rose-950 border-rose-500 shadow-rose-950/60 animate-pulse'
                : rankInfo.rank <= 3
                ? 'bg-gradient-to-r from-amber-950/80 via-yellow-950/80 to-amber-950/80 border-amber-500 shadow-amber-950/40'
                : 'bg-gradient-to-r from-emerald-950/80 via-teal-950/80 to-slate-900 border-emerald-500/60'
            }`}>
              <div className="flex justify-between items-center mb-1">
                <span className="text-[10px] font-black uppercase tracking-wider flex items-center gap-1 text-white">
                  {rankInfo.rank === 1 && <span className="text-rose-400 animate-bounce">🔥 GAWAT! SEDIKIT LAGI NYEMPLUNG KE OVEN!</span>}
                  {rankInfo.rank === 2 && <span className="text-amber-300">⚠️ WASPADA! KOBARAN API SUDAH DEKAT</span>}
                  {rankInfo.rank === 3 && <span className="text-amber-300">⚠️ PERINGKAT #3 (ZONA PANAS)</span>}
                  {rankInfo.rank > 3 && <span className="text-emerald-300">🛡️ PERINGKAT #{rankInfo.rank} (AMAN DARI PANGGANGAN)</span>}
                </span>
                <span className="text-[10px] font-mono font-bold text-white bg-black/40 px-2 py-0.5 rounded-md">
                  {Math.round(rankInfo.progress * 5)}m / 500m
                </span>
              </div>

              {/* Progress Mini-Bar Menuju Oven */}
              <div className="w-full bg-black/60 rounded-full h-3 overflow-hidden border border-white/10 relative my-1.5">
                <div
                  className={`h-full rounded-full transition-all duration-300 ${
                    rankInfo.rank === 1 ? 'bg-rose-500' : rankInfo.rank <= 3 ? 'bg-amber-400' : 'bg-emerald-400'
                  }`}
                  style={{ width: `${Math.max(4, rankInfo.progress)}%` }}
                />
              </div>

              <p className="text-[11px] leading-tight text-white/90">
                {rankInfo.rank === 1
                  ? `😱 Tinggal ${Math.max(0, 500 - Math.round(rankInfo.progress * 5))}m lagi bebekmu matang dipanggang! Jawab BENAR cepat biar ngerem!`
                  : rankInfo.rank <= 3
                  ? `⚡ Hati-hati! ${rankInfo.ahead ? `Di depanmu: ${rankInfo.ahead}.` : ''} Jangan salah jawab kalau gamau nyalip masuk oven!`
                  : '👍 Bagus! Pertahankan posisi dingin di belakang dengan terus menjawab BENAR!'}
              </p>
            </div>
          )}

          {!currentQuestion ? (
            <div className="flex-1 flex flex-col items-center justify-center text-center p-6 bg-slate-900/60 border border-slate-800/80 rounded-3xl">
              {gameOverLoser ? (
                (() => {
                  const isMeGrilled = gameOverLoser && (gameOverLoser.id === playerId || gameOverLoser.duckId === selectedDuck);
                  const loserCharMeta = (window.DUCK_CHARACTERS && window.DUCK_CHARACTERS.find((d) => d.id === gameOverLoser?.duckId))
                    || DUCK_OPTIONS.find((d) => d.id === gameOverLoser?.duckId);
                  return isMeGrilled ? (
                    <div className="animate-in fade-in zoom-in-95 duration-200">
                      <div className="text-7xl mb-3 animate-bounce">🍗🔥</div>
                      <div className="inline-block bg-rose-500/20 border-2 border-rose-500 px-3 py-1 rounded-full text-xs font-black text-rose-300 uppercase tracking-wider mb-2">
                        GOSONG KENA API!
                      </div>
                      <h2 className="text-2xl font-black text-rose-400 mb-2 leading-tight">
                        BEBEK KAMU BERHASIL DIPANGGANG!
                      </h2>
                      <p className="text-sm text-slate-200 mb-4">
                        Aduh! #{selectedDuck} {currentDuckMeta.name} milikmu adalah yang pertama menembus kobaran api dan matang sempurna jadi Bebek Panggang!
                      </p>
                      <div className="p-4 bg-gradient-to-r from-rose-950 to-amber-950 rounded-2xl border-2 border-yellow-400/80 text-yellow-300 font-extrabold text-sm shadow-xl">
                        🎤 SIAPKAN DIRI! KAMU HARUS MAJU SEKARANG UNTUK PRESENTASI!
                      </div>
                    </div>
                  ) : (
                    <div className="animate-in fade-in zoom-in-95 duration-200">
                      <div className="text-7xl mb-3">🎉🦆</div>
                      <div className="inline-block bg-emerald-500/20 border-2 border-emerald-500 px-3 py-1 rounded-full text-xs font-black text-emerald-300 uppercase tracking-wider mb-2">
                        SELAMAT DARI API!
                      </div>
                      <h2 className="text-2xl font-black text-emerald-400 mb-2 leading-tight">
                        BEBEK KAMU SELAMAT DARI PANGGANGAN!
                      </h2>
                      <p className="text-sm text-slate-200 mb-4">
                        Bagus sekali! Bebek #{selectedDuck} {currentDuckMeta.name} milikmu berhasil ngerem dan tetap aman di air sungai dingin.
                      </p>
                      <div className="p-4 bg-slate-800 rounded-2xl border border-slate-700 text-xs text-slate-300">
                        Yang gosong dipanggang dan harus presentasi:
                        <span className="block font-black text-rose-400 text-base mt-1 flex items-center justify-center gap-1.5">
                          <span>🍗 {gameOverLoser?.name || 'Temanmu'}</span>
                          {loserCharMeta && (
                            <span className="text-xs text-yellow-400 font-bold">
                              ({loserCharMeta.emoji} {loserCharMeta.name})
                            </span>
                          )}
                        </span>
                      </div>
                    </div>
                  );
                })()
              ) : (
                <div>
                  <div className="text-6xl animate-bounce mb-4">🦆</div>
                  <h2 className="text-xl font-black text-white mb-2">Kamu Sudah Terdaftar!</h2>
                  <p className="text-sm text-slate-400 mb-6">
                    Menunggu Host memulai balapan di layar proyektor...
                  </p>
                  <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-bold animate-pulse">
                    ● Terhubung ke Room {roomCode}
                  </div>
                </div>
              )}
            </div>
          ) : (
            <div className="flex-1 flex flex-col justify-between py-2">
              <div className="text-center bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-lg mb-4">
                <span className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-1">
                  Jawab Cepat:
                </span>
                <h2 className="text-xl font-black text-yellow-400 leading-snug mb-3">
                  {currentQuestion.q}
                </h2>

                {feedback === 'SLOWED' && (
                  <div className="inline-flex items-center gap-1.5 bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 text-xs px-3.5 py-1.5 rounded-full font-bold animate-bounce shadow">
                    <span>🛑</span> JAWABAN BENAR! Bebek Melambat Selamat!
                  </div>
                )}
                {feedback === 'BOOSTED' && (
                  <div className="inline-flex items-center gap-1.5 bg-rose-500/20 border border-rose-500/50 text-rose-300 text-xs px-3.5 py-1.5 rounded-full font-bold animate-pulse shadow">
                    <span>🔥</span> JAWABAN SALAH! Bebek Meluncur Cepat!
                  </div>
                )}
              </div>

              {/* 4 Pilihan Jawaban */}
              <div className="grid grid-cols-2 gap-3.5 my-auto">
                {currentQuestion.options.map((opt, idx) => {
                  const optionStyles = [
                    'bg-rose-600 hover:bg-rose-500 active:bg-rose-700 border-rose-400/40',
                    'bg-blue-600 hover:bg-blue-500 active:bg-blue-700 border-blue-400/40',
                    'bg-amber-600 hover:bg-amber-500 active:bg-amber-700 border-amber-400/40',
                    'bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 border-emerald-400/40',
                  ];

                  const isThisChosen = selectedOption === idx;

                  return (
                    <button
                      key={idx}
                      disabled={hasAnswered}
                      onClick={() => handleAnswer(idx)}
                      className={`${optionStyles[idx % 4]} min-h-[105px] rounded-2xl font-black text-lg p-3 flex flex-col items-center justify-center text-center shadow-lg transition-all duration-150 transform active:scale-95 disabled:cursor-not-allowed border-2 ${
                        isThisChosen
                          ? 'ring-4 ring-white scale-95 brightness-110'
                          : hasAnswered
                          ? 'opacity-40'
                          : 'hover:scale-[1.02]'
                      }`}
                    >
                      <span className="text-white drop-shadow">{opt}</span>
                    </button>
                  );
                })}
              </div>

              <div className="text-center text-xs text-slate-400 pt-3">
                {hasAnswered ? (
                  <span className="text-cyan-400 font-bold">
                    ✓ Jawaban terkirim! Menunggu soal berikutnya...
                  </span>
                ) : (
                  <span>⚠️ Hati-hati: Salah jawab bikin bebekmu makin dekat ke finish presentasi!</span>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<PlayerApp />);
    } catch (e) {
      console.error('Render error:', e);
    }
  </script>
</body>
</html>
